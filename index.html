<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Schosky Store</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #2c3e50; }
    .producto { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
    .producto img { max-width: 150px; display: block; margin-bottom: 5px; }
    .boton { background: #27ae60; color: white; padding: 5px 10px; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Bienvenidos a Schosky Store</h1>
  <p>Esta es nuestra tienda en línea. 🚀</p>

  <h2>Productos</h2>

  <div class="producto">
    <img src="producto1.jpg" alt="Producto 1">
    <h3>Producto 1</h3>
    <p>Precio: $100</p>
    <a href="https://link-del-producto1.com" class="boton">Comprar</a>
  </div>

  <div class="producto">
    <img src="producto2.jpg" alt="Producto 2">
    <h3>Producto 2</h3>
    <p>Precio: $200</p>
    <a href="https://link-del-producto2.com" class="boton">Comprar</a>
  </div>

  <div class="producto">
    <img src="producto3.jpg" alt="Producto 3">
    <h3>Producto 3</h3>
    <p>Precio: $300</p>
    <a href="https://link-del-producto3.com" class="boton">Comprar</a>
  </div>

</body>
</html>
